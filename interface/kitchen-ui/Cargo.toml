[package]
name = "kitchen-ui"
description = "Shared UI for GPUI apps (gpui-kit): design tokens, light and dark themes with a contrast-checked accent, widgets, a parameter editor, icon bundling and its test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
# Published on crates.io (the other workspace crates are not, unless they say so)
publish = true
repository = "https://github.com/neuro-kitchen/kitchen"
homepage = "https://github.com/neuro-kitchen/kitchen"
readme = "README.md"
keywords = ["gui", "gpui", "design-tokens", "widgets", "ui"]
categories = ["gui"]

[dependencies]
gpui-kit.workspace = true
similar.workspace = true
# Times of day in the local time zone (the timeline's axis and cards)
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true

# Code highlighting (CodeView, fenced code in TextView): tree-sitter with the Rust and Python
# grammars (JSON comes with the base feature). Not in a browser: gpui-kit has no tree-sitter on
# `wasm`, where code shows without colours.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-rust", "tree-sitter-python"] }

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`)
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
