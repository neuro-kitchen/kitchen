[package]
name = "kitchen-editor"
description = "The Code workspace the neuro-kitchen apps share: Python and Rust scripts that become commands and pipeline steps, with change marks, an external editor and completions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"
publish.workspace = true
readme = "README.md"

[dependencies]
gpui-kit.workspace = true
kitchen-ui.workspace = true
# Commands, jobs, key bindings, the Changes panel's baselines
kitchen-shell.workspace = true
serde_json.workspace = true
# Completions and hover help: gpui-kit's editor takes LSP's types
lsp-types.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`)
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "code-gallery"
path = "examples/code_gallery.rs"
