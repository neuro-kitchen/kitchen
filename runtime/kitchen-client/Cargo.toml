[package]
name = "kitchen-client"
description = "The neuro-kitchen runtime API's client side: the calls as data, the Runtime trait, and the in-process runtime (compute workers, runs kept in the store, identical runs reused)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"
publish.workspace = true
readme = "README.md"

[dependencies]
kitchen-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The in-process runtime (threads, files, the store): not in a browser, where a page reaches a
# runtime through kitchen-web
[target.'cfg(not(target_family = "wasm"))'.dependencies]
kitchen-store.workspace = true
jiff.workspace = true
