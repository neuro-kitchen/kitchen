[package]
name = "kitchen-net"
description = "The neuro-kitchen network layer: a server's own certificate authority, client enrollment and tokens, pairing with a short code (SPAKE2), TLS for QUIC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"

# Merged from dsp-kitchen `dspk-stream` (0.0.13: transport/{auth, tls, pairing}, pair) and lucem
# `lucem-stream` (0.0.6: auth, tls, pairing, pair). The projects keep their messages (protobuf),
# the engines that answer them, and their servers' request handling.

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Pairing with a short code (SPAKE2, then MACs under the shared key): the server, a computer,
# and a page in a browser (`pair`)
spake2.workspace = true
hmac.workspace = true

# The authority, TLS and pairing over QUIC: not in a browser, where only `pair` is used
[target.'cfg(not(target_family = "wasm"))'.dependencies]
quinn.workspace = true
# `x509-parser`: a client's public key read back when it pairs (it makes its own key pair)
rcgen = { workspace = true, features = ["x509-parser"] }
rustls.workspace = true
# Pairing codes and tokens are drawn from the system's randomness
getrandom.workspace = true
# `time`: a pairing connection has a time limit
tokio = { workspace = true, features = ["time"] }

# In a browser SPAKE2's randomness (rand_core 0.6 → getrandom 0.2) comes from the page's
# `crypto.getRandomValues`
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
