[package]
name = "kitchen-agent"
description = "The agent workspace of the neuro-kitchen apps (sessions, conversation, Changes and Files) and an MCP host serving the app's registered commands as tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"

[dependencies]
async-channel.workspace = true
gpui-kit.workspace = true
kitchen-shell.workspace = true
kitchen-ui.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# An MCP client in the tests
rmcp = { workspace = true, features = ["client"] }
schemars.workspace = true

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
