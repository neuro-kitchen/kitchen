version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"
homepage = "https://github.com/neuro-kitchen/kitchen"
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Content hashes of scripts (what a confirmation is bound to)
sha2.workspace = true
