[package]
name = "kitchen-shell"
description = "The frame the neuro-kitchen apps share: one command registry for menus, search, keys and agents; the view container; title, menu and status bars; Settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/neuro-kitchen/kitchen"

[dependencies]
gpui-kit.workspace = true
kitchen-ui.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`)
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
