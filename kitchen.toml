# kitchen's layers, as data: `cargo xtask check-layers` checks them in CI
# (standard/architecture.md). Lowest first: a crate may depend on crates in its own layer or
# below, never above. Every workspace crate is in exactly one layer.

[project]
license = "MIT OR Apache-2.0"

[[layers]]
name = "contract"
# contract/: types, ops, results, pipelines; depends on nothing of ours
crates = ["kitchen-contract"]

[[layers]]
name = "runtime"
# runtime/: one back end for every app
crates = [
    "kitchen-engine",
    "kitchen-scripts",
    "kitchen-store",
    "kitchen-services",
    "kitchen-client",
    "kitchen-wire",
    "kitchen-compute",
    "kitchen-network",
    "kitchen-downloads",
    "kitchen-tools",
]

[[layers]]
name = "interface"
# interface/: reaches the runtime only through its client (from phase 2, step 4)
crates = ["kitchen-ui", "kitchen-views", "kitchen-shell", "kitchen-editor", "kitchen-chat"]

[[layers]]
name = "tools"
# Never published
crates = ["xtask"]

[rules]
# Upward dependencies that exist, each with why and the step that removes it. None since phase 2,
# step 3d; the check fails if one is added without being listed here.
exceptions = []
