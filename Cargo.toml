[workspace]
resolver = "3"
members = [
    # Design tokens, widgets, the parameter editor, icon bundling and its test
    "crates/kitchen-ui",
    # The frame every app shares: commands and search, the view container, title, menu and status
    # bars, jobs, Settings, the Changes panel, the Scripts workspace
    "crates/kitchen-shell",
    # Verified downloads and the model cache: all network access of the apps' models
    "crates/kitchen-hub",
    # Plugins: the JSON-lines protocol, discovery, a client, the manager and its Settings page
    "crates/kitchen-plugin",
    # The agent workspace and the MCP host serving the registered commands
    "crates/kitchen-agent",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
authors = ["jesusdpa1"]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# UI: GPUI through gpui-kit (re-exports gpui, gpui-base, gpui-component, the icon assets)
gpui-kit = "0.9.1"
# Line diffs (DiffView)
similar = "3.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Command arguments as JSON Schema (the agent's tool inputs)
schemars = "1.2.3"
kitchen-ui = { path = "crates/kitchen-ui", version = "0.0.3" }
# Verified downloads (kitchen-hub)
sha2 = "0.11.1"
ureq = "3.5.1"
flate2 = "1.1.11"
tar = "0.4.46"
kitchen-hub = { path = "crates/kitchen-hub", version = "0.0.3" }
kitchen-shell = { path = "crates/kitchen-shell", version = "0.0.3" }
# The Agent Client Protocol (official Rust SDK): the chat's agent, started by the app
agent-client-protocol = "5.2.0"
# The MCP host (official Rust SDK) and its runtime
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros"] }
async-channel = "2.5.0"
# The status bar's CPU and memory meters
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
