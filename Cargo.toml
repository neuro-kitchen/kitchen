[workspace]
resolver = "3"
members = [
    # ---- compute/: the CubeCL layer every crate reaches a GPU through ----
    "compute/kitchen-compute",
    # ---- contract/: the waist (types, ops, results, pipelines); depends on nothing of ours ----
    # The contract as Rust types: types, ops, results and run records, pipelines and their check
    "contract/kitchen-contract",

    # ---- runtime/: one back end for every app ----
    # The engine: runs a checked pipeline over the data each app walks, piece by piece
    "runtime/kitchen-engine",
    # Script ops: Python and Rust files read as ops, checked, run by warm workers
    "runtime/kitchen-scripts",
    # The store: content ids of files and stores, run records in the workspace, results by
    # reference, lineage both ways, export
    "runtime/kitchen-store",
    # Services the frame shows: jobs, the activity log, people, environments, file changes
    "runtime/kitchen-services",
    # The runtime API's client side: the calls as data, the Runtime trait, the in-process runtime
    "runtime/kitchen-client",
    # The runtime API on the wire: runtime.proto's messages, framing, data chunks
    "runtime/kitchen-wire",
    # The runtime API served: WebTransport over HTTP/3 (pairing, tokens), and a native client
    "runtime/kitchen-server",
    # The runtime API from a browser page: WebTransport or Connect, the engine worker
    "runtime/kitchen-web",
    # The compute layer: run-time choice of a CubeCL runtime, device lifetime, launch geometry
    # The network layer: a server's certificate authority, pairing with a short code, TLS for QUIC
    "runtime/kitchen-network",
    # Verified downloads and the model cache: all network access of the apps' models
    "runtime/kitchen-downloads",
    # Tools and plugins: separate programs over JSON lines, the manager; describe, validate, run
    "runtime/kitchen-tools",

    # ---- interface/: reaches the runtime only through its client ----
    # Design tokens, widgets, the parameter editor, icon bundling and its test
    "interface/kitchen-ui",
    # Views the apps share: the dock, one clock for every view, aligned clocks, video with keypoints
    "interface/kitchen-views",
    # The frame every app shares: commands and search, title, menu and status bars, jobs, Settings,
    # the Changes panel, the file picker
    "interface/kitchen-shell",
    # The Code workspace: scripts that become commands and pipeline ops, change marks, an external
    # editor, completions
    "interface/kitchen-editor",
    # The agent workspace and the MCP host serving the registered commands
    "interface/kitchen-chat",

    # The layer check (cargo xtask check-layers) and other repository tasks
    "xtask",
]

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.95"
authors = ["jesusdpa1"]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
web-time = "1.1.0"
# UI: GPUI through gpui-kit (re-exports gpui, gpui-base, gpui-component, the icon assets)
gpui-kit = "0.11.0"
# Line diffs (DiffView)
similar = "3.2.1"
# Local times of day (the timeline)
jiff = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Command arguments as JSON Schema (the agent's tool inputs)
schemars = "1.2.3"
# The key bindings file, read with its comments kept (kitchen-shell::keys)
toml_edit = "0.25.21"
# Completions and hover help in the code editor (kitchen-editor): the editor speaks LSP's types
lsp-types = "0.97.0"
anyhow = "1.0.105"
# Video (kitchen-views): image sequences; MP4 with H.264 decoded in Rust (OpenH264, BSD)
# The image list GPUI draws a frame from
smallvec = "1.16.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
mp4 = "0.14.0"
openh264 = "0.9.10"
kitchen-ui = { path = "interface/kitchen-ui", version = "0.0.9" }
kitchen-views = { path = "interface/kitchen-views", version = "0.0.9" }
# Verified downloads (kitchen-downloads)
sha2 = "0.11.2"
ureq = "3.5.2"
flate2 = "1.1.11"
tar = "0.4.46"
kitchen-downloads = { path = "runtime/kitchen-downloads", version = "0.0.9" }
kitchen-shell = { path = "interface/kitchen-shell", version = "0.0.9" }
kitchen-editor = { path = "interface/kitchen-editor", version = "0.0.9" }
kitchen-contract = { path = "contract/kitchen-contract", version = "0.0.9" }
kitchen-engine = { path = "runtime/kitchen-engine", version = "0.0.9" }
kitchen-scripts = { path = "runtime/kitchen-scripts", version = "0.0.9" }
# The Agent Client Protocol (official Rust SDK): the chat's agent, started by the app
agent-client-protocol = "5.6.1"
# The MCP host (official Rust SDK) and its runtime
rmcp = { version = "3.12.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros"] }
async-channel = "2.5.0"
# The compute layer (kitchen-compute). `persistence`: autotune decisions and compiled kernels
# survive the process (`configure_runtime`)
cubecl = { version = "0.11.4", default-features = false, features = ["std", "stdlib", "persistence"] }
thiserror = "2.0.21"
tracing = "0.1.44"
kitchen-compute = { path = "compute/kitchen-compute", version = "0.0.9" }
# The network layer (kitchen-network): QUIC and TLS, a server's own certificate authority, pairing
# with a short code (SPAKE2, HMAC)
quinn = "0.11.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"
spake2 = "0.4.0"
hmac = "0.13.0"
getrandom = "0.4.3"
kitchen-network = { path = "runtime/kitchen-network", version = "0.0.9" }
# The browser side (kitchen-web), as lucem and dsp-kitchen use them
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro"] }
# Zarr (v2 and v3, sharded): stored results read by range (as dsp-kitchen reads its recordings)
zarrs = { version = "0.23.14", default-features = false, features = ["blosc", "crc32c", "gzip", "sharding", "zstd", "filesystem"] }
kitchen-store = { path = "runtime/kitchen-store", version = "0.0.9" }
kitchen-services = { path = "runtime/kitchen-services", version = "0.0.9" }
kitchen-client = { path = "runtime/kitchen-client", version = "0.0.9" }
kitchen-wire = { path = "runtime/kitchen-wire", version = "0.0.9" }
# The runtime API's server: WebTransport over HTTP/3 (as lucem-stream serves pages)
wtransport = "0.7.2"
# Its fallback on TCP: Connect, gRPC and gRPC-Web, answered by hand on hyper (one unary call)
hyper = { version = "1.13.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.11.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
prost-reflect = "0.16.5"
kitchen-tools = { path = "runtime/kitchen-tools", version = "0.0.9" }
# The status bar's CPU and memory meters
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
