# cargo-deny: supply-chain checks run in CI (`cargo deny check`) and locally.
# - advisories: no crate with a known vulnerability (RustSec), none yanked;
# - licenses: only the licences listed (kitchen itself is MIT OR Apache-2.0);
# - bans: no wildcard version requirements;
# - sources: crates.io only (no git dependencies, no other registries).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# A crate no longer maintained is an error when kitchen depends on it directly; deep in the GUI
# stack (fonts, D-Bus) it is the upstream's to replace, and CI would fail on every one
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
